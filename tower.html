<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tower Game</title>
  <style>
    :root{
      --gap:6px;
      --tower-w:280px;
    }
    body{
      margin:0; font-family:Arial,Helvetica,sans-serif; color:#fff; overflow:hidden; background:#000;
    }
    body::before{content:""; position:fixed; inset:0; background:url("gifi.gif") center/cover no-repeat; z-index:-1;}

    .back-btn {
      position: fixed;
      top: 12px;
      left: 24px;
      background: #203c34;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #305248;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      z-index: 1000;
    }
    .back-btn:hover { background: #285448; }

    .container{display:flex; height:100vh; width:100vw; justify-content:center; align-items:center; gap:28px; padding:12px;}

    .sidebar{min-width:220px; background:rgba(0,0,0,0.6); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,0.35);}
    .sidebar h2{margin:0 0 6px 0; text-align:center;}
    .sidebar label{opacity:.9; font-size:.95rem;}
    .sidebar input,.sidebar select,.sidebar button{padding:10px 12px; border:none; border-radius:10px; font-size:1rem; outline:none;}
    .sidebar button{background:linear-gradient(180deg,#00c6ff,#0072ff); color:#fff; font-weight:700; cursor:pointer; transition:transform .15s;}
    .sidebar button:hover{transform:scale(1.04)}
    .info{font-weight:700; text-align:center;}

    .stage{display:flex; align-items:stretch; gap:22px;}
    .tower{height:90vh; width:var(--tower-w); display:flex; flex-direction:column-reverse; gap:var(--gap);}
    .row{flex:1; width:100%; display:flex; justify-content:center; align-items:stretch; gap:var(--gap);}
    .tile{width:calc((100% - (3*var(--gap))) / 4); height:100%; border-radius:8px; cursor:pointer; background:rgba(0,150,255,.6); border:2px solid #00eaff; box-shadow:inset 0 0 6px rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.4); transition:transform .15s, background .25s, box-shadow .25s; position:relative; overflow:hidden;}
    .tile:hover{transform:scale(1.04); background:rgba(0,200,255,.75);} 
    .tile::after{content:""; position:absolute; inset:0 0 50% 0; background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0));}
    .tile.safe{background:rgba(0,255,100,.75)!important; box-shadow:0 0 16px 4px rgba(0,255,120,.85), inset 0 0 6px rgba(255,255,255,.55)!important;}
    .tile.bomb{background:rgba(255,0,0,.78)!important; box-shadow:0 0 16px 4px rgba(255,0,0,.9), inset 0 0 6px rgba(255,200,200,.5)!important;}
    .tile.reveal-safe{background:rgba(0,255,100,.4)!important;}
    .tile.reveal-bomb{background:rgba(255,0,0,.4)!important;}

    .ladder{width:230px; backdrop-filter:blur(2px); background:rgba(0,0,0,.45); border-radius:14px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.35);}
    .step{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; margin:8px 0; border-radius:12px; border:1px solid rgba(0,234,255,.25); background:rgba(10,16,24,.55); box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);} 
    .step .hit{font-weight:800; letter-spacing:.5px;}
    .step .mult{opacity:.95; font-weight:700;}
    .step.active{border-color:#00c6ff; box-shadow:0 0 12px rgba(0,198,255,.35), inset 0 0 0 1px rgba(255,255,255,.06);} 
    .step.reached{border-color:#00ff88; box-shadow:0 0 14px rgba(0,255,120,.45), inset 0 0 0 1px rgba(255,255,255,.08);} 

    @media (max-width: 980px){
      .container{flex-direction:column; gap:16px;}
      .stage{flex-direction:column; align-items:center;}
      .tower{height:70vh;}
      .ladder{width:min(260px,90vw)}
    }
  </style>
</head>
<body>
  <!-- Back button -->
  <button class="back-btn" onclick="history.back()">← Back</button>

  <div class="container">
    <div class="sidebar">
      <h2>Balance: $<span id="balance">0</span></h2>
      <label>Bet Amount:</label>
      <input type="number" id="bet-amount" value="10" min="1"/>
      <label>Difficulty:</label>
      <select id="difficulty">
        <option value="low">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="bet-btn">Bet</button>
      <div class="info" id="status">Choose difficulty and place a bet.</div>
      <div class="info">Current Multiplier: <span id="multiplier">1.00×</span></div>
    </div>

    <div class="stage">
      <div class="tower" id="tower"></div>
      <div class="ladder" id="ladder"></div>
    </div>
  </div>

  <script>
    const SERVER_URL = 'https://casinoaqua-server.onrender.com';

    const payouts={
      low:[1.28,1.71,2.28,3.03,4.05,5.39,7.19,9.59,12.79,17.05],
      medium:[1.44,2.16,3.24,4.86,7.29,10.93,16.40,24.60,36.91,55.36],
      hard:[1.92,3.84,7.68,15.36,30.72,61.44,122.88,245.76,491.52,983.04]
    };

    let balance=0, bet=0, difficulty='low', currentRow=0, bombPositions=[], gameActive=false;

    const towerEl=document.getElementById('tower');
    const ladderEl=document.getElementById('ladder');
    const balanceEl=document.getElementById('balance');
    const betEl=document.getElementById('bet-amount');
    const diffEl=document.getElementById('difficulty');
    const statusEl=document.getElementById('status');
    const betBtn=document.getElementById('bet-btn');
    const multiplierEl=document.getElementById('multiplier');

    const fmt=v=>`$${v.toLocaleString()}`;

    async function loadUserAndBalance(){
      try{
        const token = localStorage.getItem('token');
        if(!token) return;
        const res = await fetch(`${SERVER_URL}/me`, { headers: { 'Authorization': `Bearer ${token}` }});
        const data = await res.json();
        if(data && data.success){
          balance = Number(data.user.balance)||0;
          balanceEl.textContent=balance.toFixed(2);
        }
      }catch(e){}
    }

    async function saveBalance(){
      try{
        const token = localStorage.getItem('token');
        if(!token) return;
        await fetch(`${SERVER_URL}/update-balance`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` },
          body: JSON.stringify({ balance })
        });
      }catch(e){}
    }

    function buildTower(){
      towerEl.innerHTML='';
      const tilesPerRow = {low:4, medium:3, hard:2}[difficulty];
      for(let r=0;r<10;r++){
        const row=document.createElement('div');
        row.className='row';
        for(let c=0;c<tilesPerRow;c++){
          const tile=document.createElement('div');
          tile.className='tile';
          tile.dataset.row=r; tile.dataset.index=c;
          row.appendChild(tile);
        }
        towerEl.appendChild(row);
      }
    }

    function buildLadder(){
      ladderEl.innerHTML='';
      const arr=payouts[difficulty];
      for(let i=0;i<10;i++){
        const step=document.createElement('div');
        step.className='step';
        step.dataset.step=i+1;
        const left=document.createElement('div'); left.className='hit'; left.textContent=`HIT ${i+1}`;
        const right=document.createElement('div'); right.className='mult'; right.textContent=`${arr[i].toFixed(2)}×`;
        step.appendChild(left); step.appendChild(right);
        ladderEl.appendChild(step);
      }
      highlightLadder();
    }

    function highlightLadder(){
      const steps=[...ladderEl.querySelectorAll('.step')];
      steps.forEach((s,idx)=>{s.classList.remove('active','reached'); if(idx<currentRow) s.classList.add('reached');});
      if(currentRow<10) steps[currentRow]?.classList.add('active');
    }

    function startGame(){
      bet=parseFloat(betEl.value);
      if(!bet||bet<=0||bet>balance){alert('Invalid bet amount');return;}
      balance-=bet; balanceEl.textContent=balance.toFixed(2);
      currentRow=0; bombPositions=[]; gameActive=true;
      betBtn.textContent='Cash Out';
      diffEl.disabled=true;
      statusEl.textContent='Game started! Pick a tile.';
      multiplierEl.textContent='1.00×';
      buildTower(); highlightLadder();
      saveBalance();
    }

    function revealTile(tile){
      if(!gameActive) return;
      const r=+tile.dataset.row; if(r!==currentRow) return;
      if(bombPositions[r]===undefined){
        const cols={low:4,medium:3,hard:2}[difficulty];
        bombPositions[r]=Math.floor(Math.random()*cols);
      }
      if(+tile.dataset.index===bombPositions[r]){
        tile.classList.add('bomb');
        gameOver(false);
      }else{
        tile.classList.add('safe');
        currentRow++;
        if(currentRow>0){const m=payouts[difficulty][currentRow-1]; multiplierEl.textContent=m.toFixed(2)+'×';}
        highlightLadder();
        if(currentRow>=10){gameOver(true);} else {statusEl.textContent='Safe! Go up.';}
      }
    }

    function revealAllTiles(){
      const rows=[...towerEl.querySelectorAll('.row')];
      rows.forEach((row,r)=>{
        const tiles=[...row.querySelectorAll('.tile')];
        const cols={low:4,medium:3,hard:2}[difficulty];
        if(bombPositions[r]===undefined){
          bombPositions[r]=Math.floor(Math.random()*cols);
        }
        tiles.forEach((tile,i)=>{
          if(i===bombPositions[r]){
            if(!tile.classList.contains('bomb')) tile.classList.add('reveal-bomb');
          } else {
            if(!tile.classList.contains('safe')) tile.classList.add('reveal-safe');
          }
        });
      });
    }

    function gameOver(win){
      gameActive=false;
      revealAllTiles();
      if(win){
        const winnings=bet*payouts[difficulty][currentRow-1];
        balance+=winnings; balanceEl.textContent=balance.toFixed(2);
        statusEl.textContent=`You climbed all! Winnings: $${winnings.toFixed(2)}`;
      }else{statusEl.textContent='Boom! You lost.';}
      betBtn.textContent='Bet';
      diffEl.disabled=false;
      saveBalance();
    }

    function cashOut(){
      if(!gameActive||currentRow===0) return;
      const mult=payouts[difficulty][currentRow-1];
      const winnings=bet*mult; balance+=winnings; balanceEl.textContent=balance.toFixed(2);
      statusEl.textContent=`Cashed out at ${mult.toFixed(2)}×`;
      gameActive=false; betBtn.textContent='Bet';
      diffEl.disabled=false;
      revealAllTiles();
      saveBalance();
    }

    towerEl.addEventListener('click',e=>{ if(e.target.classList.contains('tile')) revealTile(e.target); });
    betBtn.addEventListener('click',()=>{ if(!gameActive) startGame(); else cashOut(); });
    diffEl.addEventListener('change',()=>{
      if(gameActive) return;
      difficulty=diffEl.value; buildTower(); buildLadder(); statusEl.textContent='Choose difficulty and place a bet.'; multiplierEl.textContent='1.00×'; currentRow=0;
    });

    buildTower(); buildLadder();
    loadUserAndBalance();
  </script>
</body>
</html>
